[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7
  sandeepmistry/CAN @ ^0.0.1
  sandeepmistry/OBD2 @ ^0.0.1

build_flags =
  -DCORE_DEBUG_LEVEL=3
  -D MQTT_MAX_PACKET_SIZE=1024
  ; ESP32 TWAI pins (ESP-OBD2 boards often use RX=27 TX=26) — override per board if needed
  -D CAN_RX_PIN=27
  -D CAN_TX_PIN=26
